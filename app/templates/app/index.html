{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ app_name }} Page</title>
    <link rel="stylesheet" href="{%  static 'css/index.css' %}" type="text/css">
</head>
<body>
    <header>
        <h1>{{ app_name }} Page</h1>
        <p>{{ description }}</p>
    </header>

    <div class="container">
        <ul class="tasks">
            {% for task in tasks %}
            <li>
                <span>{{ task.name }}</span>
                {% if task.done %}
                <span class="status done">Done</span>
                {% else %}
                <span class="status pending">Pending</span>
                {% endif %}
            </li>
            {% endfor %}
        </ul>

        <p class="version">v{{ version }}</p>
    </div>
</body>
</html>
