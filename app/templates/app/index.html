<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ app_name }} Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1e1e2f;
            color: #eaeaea;
        }
        header {
            background-color: #29294a;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #6c63ff;
        }
        header h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
        }
        header p {
            margin: 0;
            color: #b8b8d1;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        ul.tasks {
            list-style: none;
            padding: 0;
        }
        ul.tasks li {
            background-color: #29294a;
            margin-bottom: 10px;
            padding: 12px 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status.done {
            background-color: #2ecc71;
            color: #0b3d20;
        }
        .status.pending {
            background-color: #f1c40f;
            color: #4d3b00;
        }
        .version {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: #8888a8;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{ app_name }} Page</h1>
        <p>{{ description }}</p>
    </header>

    <div class="container">
        <ul class="tasks">
            {% for task in tasks %}
            <li>
                <span>{{ task.name }}</span>
                {% if task.done %}
                <span class="status done">Done</span>
                {% else %}
                <span class="status pending">Pending</span>
                {% endif %}
            </li>
            {% endfor %}
        </ul>

        <p class="version">v{{ version }}</p>
    </div>
</body>
</html>
