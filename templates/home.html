{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ site_name }}</title>
    <link rel="stylesheet" href="{% static 'css/home.css' %}" type="text/css">
</head>
<body>
    <header>
        <h1>Welcome to {{ site_name }}</h1>
        <p>{{ tagline }}</p>
    </header>

    <div class="container">
        <div class="features">
            {% for feature in features %}
            <div class="card">
                <h3>{{ feature.title }}</h3>
                <p>{{ feature.description }}</p>
            </div>
            {% endfor %}
        </div>

        <p class="visitor-count">You are visitor number {{ visitor_count }}.</p>
    </div>
</body>
</html>
