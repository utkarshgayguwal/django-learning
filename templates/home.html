<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ site_name }}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }
        header {
            background-color: #0c4a6e;
            color: #fff;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0 0 10px;
            font-size: 2rem;
        }
        header p {
            margin: 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .features {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            flex: 1 1 250px;
        }
        .card h3 {
            margin-top: 0;
            color: #0c4a6e;
        }
        .visitor-count {
            text-align: center;
            margin-top: 30px;
            font-size: 0.95rem;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to {{ site_name }}</h1>
        <p>{{ tagline }}</p>
    </header>

    <div class="container">
        <div class="features">
            {% for feature in features %}
            <div class="card">
                <h3>{{ feature.title }}</h3>
                <p>{{ feature.description }}</p>
            </div>
            {% endfor %}
        </div>

        <p class="visitor-count">You are visitor number {{ visitor_count }}.</p>
    </div>
</body>
</html>
